# rustc as a wasm32-wasip1-threads host cannot dlopen: proc macros are unsupported, so libloading is cfg'd out.
id: host-dylib-use
language: rust
files: [compiler/rustc_metadata/src/host_dylib.rs]
metadata: { expect: 3 }
rule:
  kind: use_declaration
  pattern: $U
  regex: '^use (std::error::Error|std::time::Duration|rustc_fs_util::try_canonicalize);$'
fix: |-
  #[cfg(any(unix, windows))]
  $U
---
id: host-dylib-fns
language: rust
files: [compiler/rustc_metadata/src/host_dylib.rs]
metadata: { expect: 3 }
rule:
  kind: function_item
  pattern: $F
  has: { field: name, regex: ^(format_dlopen_err|attempt_load_dylib|load_dylib)$ }
fix: |-
  #[cfg(any(unix, windows))]
  $F
---
id: host-dylib-load-symbol
language: rust
files: [compiler/rustc_metadata/src/host_dylib.rs]
metadata: { expect: 1 }
rule:
  kind: function_item
  pattern: $F
  has: { field: name, regex: ^load_symbol_from_dylib$ }
fix: |-
  #[cfg(any(unix, windows))]
  $F

  #[cfg(not(any(unix, windows)))]
  pub unsafe fn load_symbol_from_dylib<T: Copy>(
      path: &Path,
      _sym_name: &str,
  ) -> Result<T, DylibError> {
      Err(DylibError::DlOpen(
          path.display().to_string(),
          "loading dynamic libraries is not supported on this target".to_string(),
      ))
  }
---
id: enzyme-lib-field
language: rust
files: [compiler/rustc_codegen_llvm/src/llvm/enzyme_ffi.rs]
metadata: { expect: 1 }
rule:
  kind: field_declaration
  pattern: $F
  regex: 'libloading::Library'
fix: |-
  #[cfg(any(unix, windows))]
  $F
---
id: enzyme-load-symbol
language: rust
files: [compiler/rustc_codegen_llvm/src/llvm/enzyme_ffi.rs]
metadata: { expect: 1 }
rule:
  kind: function_item
  pattern: $F
  has: { field: name, regex: ^load_ptr_by_symbol_mut_void$ }
fix: |-
  #[cfg(any(unix, windows))]
  $F
---
id: enzyme-call-dynamic
language: rust
files: [compiler/rustc_codegen_llvm/src/llvm/enzyme_ffi.rs]
metadata: { expect: 1 }
rule:
  kind: function_item
  pattern: $F
  has: { field: name, regex: ^call_dynamic$ }
fix: |-
  #[cfg(any(unix, windows))]
  $F

  #[cfg(not(any(unix, windows)))]
  fn call_dynamic(_: &rustc_session::config::Sysroot) -> Result<Self, EnzymeLibraryError> {
      Err(EnzymeLibraryError::NotFound {
          err: "loading dynamic libraries is not supported on this target".to_string(),
      })
  }
---
id: default-sysroot-no-dll
language: rust
files: [compiler/rustc_session/src/filesearch.rs]
metadata: { expect: 1 }
rule: { pattern: 'default_from_rustc_driver_dll().expect("Failed finding sysroot")' }
fix: default_from_rustc_driver_dll().unwrap_or_default()
---
id: writeable-wasi
language: rust
files: [compiler/rustc_session/src/output.rs]
metadata: { expect: 1 }
rule:
  pattern: '!m.permissions().readonly()'
  inside: { kind: function_item, stopBy: end, has: { field: name, regex: ^is_writeable$ } }
fix: 'cfg!(target_os = "wasi") || !m.permissions().readonly()'
---
id: linker-path-join
language: rust
files: [compiler/rustc_codegen_ssa/src/back/linker.rs]
metadata: { expect: 1 }
rule: { pattern: 'cmd.env("PATH", env::join_paths(new_path).unwrap());' }
fix: 'cmd.env("PATH", env::join_paths(new_path).unwrap_or_default());'

