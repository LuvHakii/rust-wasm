id: rustfmt-in-process
language: rust
files: [crates/rust-analyzer/src/handlers/request.rs]
metadata: { expect: 1 }
rule:
  pattern: 'let output = { $$$B };'
  inside: { kind: block, inside: { kind: function_item, has: { field: name, regex: '^run_rustfmt$' } } }
fix: |-
  let Some(captured_stdout) = rustfmt_nightly::format_text(
      file.to_string(),
      command.get_current_dir().expect("rustfmt command has a working directory"),
      command.get_args(),
  )? else {
      return Ok(None);
  };
---
